name: mobile-mcp
# Smoke test for mobile-mcp (github.com/mobile-next/mobile-mcp) against the iOS simulator:
# the MCP server is driven over stdio like an agent would, takes screenshots and taps.
# Independent of tap-test.yml (own job, own artifact name, no secrets, nothing personal).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label
        default: macos-26-intel
  push:
    branches: ['mobile-mcp/**']
    paths: ['lab/mcp/**', '.github/workflows/mobile-mcp.yml']
permissions:
  contents: read
concurrency:
  group: mobile-mcp-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash --noprofile --norc {0}
jobs:
  smoke:
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 40
    env:
      OUT: ${{ github.workspace }}/results
      MOBILEMCP_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned mobile-mcp + MCP client (no install scripts)
        working-directory: lab/mcp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p "$OUT/screens"
          node -p 'require("@mobilenext/mobile-mcp/package.json").version' | tee "$OUT/mobile-mcp-version.txt"
          ls node_modules/@mobilenext/
      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t:t[0]); rt,x=c[-1]; print(x["udid"]); print(rt,x["name"],file=sys.stderr)') 2> "$OUT/device.txt"
          echo "$UDID" > "$OUT/udid.txt"; cat "$OUT/device.txt"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b | tail -2
          sleep 20
          xcrun simctl io "$UDID" screenshot "$OUT/screens/00-home.png"
      - name: mobile-mcp smoke (screenshot + tap through MCP)
        working-directory: lab/mcp
        run: node mcp_smoke.mjs "$OUT" 2>&1 | tee "$OUT/smoke.log"; exit ${PIPESTATUS[0]}
      - name: Final screenshot
        if: always()
        run: '[ -n "$UDID" ] && xcrun simctl io "$UDID" screenshot "$OUT/screens/99-final.png" || true'
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-mcp-results
          path: results
          if-no-files-found: warn
