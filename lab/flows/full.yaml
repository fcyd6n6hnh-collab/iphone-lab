# One Maestro session per shortcut (driver start-up is slow on Intel runners):
# Files > On My iPhone > tap ${FILE} > Add Shortcut > Shortcuts library > tap ${NAME} > accept prompts.
appId: com.apple.DocumentsApp
---
- launchApp: {appId: com.apple.DocumentsApp, stopApp: true}
- runFlow: {when: {visible: "Browse"}, commands: [{tapOn: "Browse"}]}
- runFlow: {when: {visible: "Browse"}, commands: [{tapOn: "Browse"}]}
- tapOn: "On My iPhone"
- extendedWaitUntil: {visible: "${FILE}", timeout: 20000}
- takeScreenshot: ${SHOTS}/01-files
- tapOn: "${FILE}"
- extendedWaitUntil: {visible: "Add Shortcut", timeout: 30000, optional: true}
- takeScreenshot: ${SHOTS}/02-import-sheet
- runFlow: accept.yaml
- takeScreenshot: ${SHOTS}/03-after-add
- launchApp: {appId: com.apple.shortcuts, stopApp: true}
- runFlow: {when: {visible: "All Shortcuts"}, commands: [{tapOn: "All Shortcuts"}]}
- extendedWaitUntil: {visible: "${NAME}", timeout: 20000}
- takeScreenshot: ${SHOTS}/04-library
- tapOn: "${NAME}"
- extendedWaitUntil: {visible: "__never_present__", timeout: 6000, optional: true}
- takeScreenshot: ${SHOTS}/05-after-tile-tap
- runFlow: accept.yaml
- extendedWaitUntil: {visible: "__never_present__", timeout: 8000, optional: true}
- takeScreenshot: ${SHOTS}/06-after-prompts
- runFlow: accept.yaml
- extendedWaitUntil: {visible: "__never_present__", timeout: 8000, optional: true}
- takeScreenshot: ${SHOTS}/07-final
